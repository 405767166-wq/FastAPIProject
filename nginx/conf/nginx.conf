# 会议纪要转写系统 · Nginx 反向代理配置（V2 网关）
# 启动：在项目根执行  nginx\nginx.exe
# 访问：http://127.0.0.1:8080   （前端；后端 API 走 /api 反代，WS 走 /ws 反代）

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 200m;   # 音频上传上限 200MB

    server {
        listen       8080;
        server_name  localhost;

        # ---- 前端：生产模式托管 Vue3 构建产物 dist（SPA 路由回退）----
        location / {
            root   C:/Users/L/PycharmProjects/FastAPIProject/frontend/dist;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 开发模式（Vite dev server，端口 5173）时，可把上面 location / 换成反代：
        # location / {
        #     proxy_pass http://127.0.0.1:5173;
        #     proxy_set_header Host $host;
        # }

        # ---- 后端 REST：保留 /api 前缀反代到 FastAPI(8000) ----
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        # ---- WebSocket 实时进度（V2）：Upgrade 透传 ----
        location /ws {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
