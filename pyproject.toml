[project]
name = "fastapiproject"
version = "0.2.0"
description = "会议纪要智能转写系统 backend（双版本：V1 基本功能 / V2 全功能，见 版本规划.md）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
